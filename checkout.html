<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
</head>
<body>
  <h1>Checkout</h1>

  <div id="cart-items"></div>
  <h3 id="cart-total"></h3>

  <form action="send_order.php" method="POST" onsubmit="prepareOrderData()">
    <label for="customerName">Full Name</label><br>
    <input type="text" id="customerName" name="customerName" required><br><br>

    <label for="customerEmail">Email</label><br>
    <input type="email" id="customerEmail" name="customerEmail" required><br><br>

    <label for="customerAddress">Shipping Address</label><br>
    <textarea id="customerAddress" name="customerAddress" required></textarea><br><br>

    <input type="hidden" id="orderData" name="orderData">

    <button type="submit">Place Order</button>
  </form>

  <script>
    function getCart() {
      return JSON.parse(localStorage.getItem("cart")) || [];
    }

    function renderCart() {
      const cart = getCart();
      const cartItemsDiv = document.getElementById("cart-items");
      const cartTotal = document.getElementById("cart-total");

      if (cart.length === 0) {
        cartItemsDiv.innerHTML = "<p>Your cart is empty.</p>";
        cartTotal.textContent = "";
        return;
      }

      let html = "<ul>";
      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `<li>${item.name} - $${item.price} x ${item.quantity} = $${itemTotal}</li>`;
      });

      html += "</ul>";
      cartItemsDiv.innerHTML = html;
      cartTotal.textContent = "Total: $" + total.toFixed(2);
    }

    function prepareOrderData() {
      const cart = getCart();
      document.getElementById("orderData").value = JSON.stringify(cart);
    }

    renderCart();
  </script>
</body>
</html>
