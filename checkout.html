<!DOCTYPE html>
  <html>
    <head>
      <title>Checkout</title>
      <link rel="stylesheet" href="style.css">
      <script src="cart.js"></script>
    </head>
    <body>
    
      <header><h1>Checkout</h1></header>
      
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="products.html">Products</a>
        <a href="checkout.html">Cart</a>
        <a href="contact.html">Contact</a>
      </nav>
      
      <div class="container">
      
        <div id="cart"></div>
      
        <form action="send_order.php" method="POST" onsubmit="prepareOrder()">
          <input type="text" name="name" placeholder="Name" required>
          <input type="email" name="email" placeholder="Email" required>
          <textarea name="address" placeholder="Address" required></textarea>
      
          <input type="hidden" name="orderData" id="orderData">
      
          <button type="submit">Place Order</button>
        </form>
      
      </div>
      
      <script>
      function renderCart() {
        let cart = getCart();
        let html = "<ul>";
        let total = 0;
      
        cart.forEach(item => {
          let t = item.price * item.quantity;
          total += t;
          html += `<li>${item.name} x${item.quantity} = $${t}</li>`;
        });
      
        html += "</ul><p>Total: $" + total + "</p>";
        document.getElementById("cart").innerHTML = html;
      }
      
      function prepareOrder() {
        document.getElementById("orderData").value =
          JSON.stringify(getCart());
      }
      
      renderCart();
      </script>
      
      <footer><p>&copy; 2026 Cologne Brand</p></footer>
      
    </body>
  </html>
